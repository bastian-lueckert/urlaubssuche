:root{--bg:#f2f5f8;--card:#fff;--ink:#1a2433;--mute:#62708a;--line:#e0e6ee;--acc:#0a8a84;--acc2:#e3f5f3;--warn:#c2410c;--ok:#15803d;--sun:#f59e0b;--hero1:#0a8a84;--hero2:#1d5fa8;--shadow:0 2px 10px rgba(20,40,70,.07)}
:root[data-theme=dark]{--bg:#0e131a;--card:#171e29;--ink:#e8edf4;--mute:#96a3b8;--line:#28323f;--acc:#3ec9bf;--acc2:#15322f;--warn:#fb923c;--ok:#4ade80;--sun:#fbbf24;--hero1:#0b4f55;--hero2:#14345f;--shadow:0 2px 12px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .2s,color .2s}
header{padding:12px 14px;background:linear-gradient(120deg,var(--hero1),var(--hero2));color:#fff;display:flex;gap:8px;align-items:center;flex-wrap:nowrap;box-shadow:0 2px 14px rgba(0,0,0,.18)}
header .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
header h1{font-size:20px;margin:0;letter-spacing:.3px;line-height:1.1}
header .tag2{font-size:12px;opacity:.85;display:block;font-weight:400}
header .btn{background:rgba(255,255,255,.14)!important;color:#fff!important;border-color:rgba(255,255,255,.3)!important;font-size:14px;padding:7px 12px!important}
header .btn:hover{background:rgba(255,255,255,.26)!important}
.dest{transition:box-shadow .2s,transform .2s}.dest:hover{box-shadow:0 6px 22px rgba(20,40,70,.14)}
.dest img{border-radius:12px}
a{color:var(--acc)}
main{max-width:920px;margin:0 auto;padding:16px}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.steps button{white-space:nowrap;font-size:13px;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mute);cursor:pointer}
.steps button.done{color:var(--acc);border-color:var(--acc)}
.steps button.cur{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
h2{margin:0 0 4px;font-size:20px}h3{margin:14px 0 6px;font-size:16px}
.sub{color:var(--mute);margin:0 0 14px;font-size:14px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--bg);user-select:none}
.opt.on{border-color:var(--acc);background:var(--acc2)}
.opt b{display:block}.opt span{font-size:13px;color:var(--mute)}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
button.btn{font:inherit;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.tag{display:inline-block;font-size:12px;background:var(--acc2);color:var(--acc);border-radius:99px;padding:2px 8px;margin:0 4px 4px 0}
.info{background:var(--acc2);border-radius:10px;padding:8px 12px;font-size:14px;margin-top:10px}
.dest h3{margin:0}.dest .meta{color:var(--mute);font-size:14px}
.cost{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.cost td{padding:3px 0;border-bottom:1px dashed var(--line)}.cost td:last-child{text-align:right;white-space:nowrap}
.cost tr.t td{font-weight:700;border-bottom:0}
.over{color:var(--warn);font-weight:600}.fine{color:var(--ok);font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.links a{font-size:13px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;color:var(--acc);text-decoration:none}
.small{font-size:13px;color:var(--mute)}
.notice{background:#fff7e0;border:1px solid #f2c94c;color:#5c4400;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
:root[data-theme=dark] .notice{background:#3a2f0b;border-color:#8a6d1a;color:#ffe9a8}
.sumrow{display:flex;gap:14px;align-items:stretch;cursor:pointer;flex-wrap:wrap}
.mapph{flex:0 0 220px;height:150px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.mapph iframe{width:100%;height:100%;border:0;pointer-events:none}
.sumtxt{flex:1;min-width:200px}.sumtxt h3{margin:0 0 2px}
.sumprice{margin:4px 0}
.favb{align-self:flex-start;white-space:nowrap}
.body{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}.body[hidden]{display:none}
.bigmap{height:380px;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin:6px 0;background:var(--bg);z-index:0}
:root[data-theme=dark] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
.legend{margin-bottom:8px}
.why{font-size:13px;color:var(--mute);margin:6px 0;line-height:1.45}.why b{color:var(--ink)}
.stickybar{position:sticky;bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:10px 14px;box-shadow:0 6px 22px rgba(0,0,0,.2)}
@media(max-width:560px){.mapph{flex:1 1 100%}header .tag2{display:none}header h1{font-size:18px}header svg{width:38px;height:38px}}header{position:relative}
header .ic{padding:6px 11px!important;font-size:17px!important;line-height:1}
.menuwrap{position:relative}
#menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 26px rgba(0,0,0,.25);padding:6px;min-width:210px;z-index:50}
#menu[hidden],#favpanel[hidden],#favbar[hidden]{display:none}
#menu button,#menu label{display:block;width:100%;text-align:left;font:inherit;font-size:15px;background:none!important;color:var(--ink)!important;border:0!important;border-radius:8px;padding:10px 12px!important;margin:0;cursor:pointer}
#menu button:hover,#menu label:hover{background:var(--acc2)!important}
#favbar{position:fixed;right:14px;bottom:14px;z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.favrow{display:flex;align-items:center;gap:8px}
#toTop{font:inherit;font-size:18px;line-height:1;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;width:42px;height:42px;box-shadow:0 4px 14px rgba(0,0,0,.22);cursor:pointer}
#toTop:hover{background:var(--acc2)}
#favpill{font:inherit;font-size:16px;font-weight:600;background:var(--acc);color:#fff;border:0;border-radius:99px;padding:9px 16px;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer}
#favpanel{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 26px rgba(0,0,0,.28);padding:10px 12px;width:min(320px,calc(100vw - 28px));max-height:55vh;overflow:auto}
#favpanel .fi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
#favpanel .fi a{cursor:pointer;color:var(--mute);text-decoration:none}
footer{max-width:920px;margin:8px auto 40px;padding:0 16px;color:var(--mute);font-size:12px;text-align:center}
#print{display:none}
@media print{@page{size:A4;margin:14mm}body>*:not(#print){display:none!important}html,body{background:#fff!important}#print{display:block;color:#1a2433;background:#fff;font-size:11pt;line-height:1.45}
.pr-head{display:flex;align-items:center;gap:12px;border-bottom:3px solid #0a8a84;padding-bottom:8px;margin-bottom:10px}.pr-head h1{margin:0;font-size:22pt;color:#0a8a84}.pr-head small{color:#62708a}
.pr-meta{background:#eef7f6;border-radius:8px;padding:8px 12px;margin-bottom:12px}
.pr-tbl{width:100%;border-collapse:collapse;margin:6px 0 10px}.pr-tbl td,.pr-tbl th{padding:4px 6px;border-bottom:1px solid #dfe3e9;text-align:left;font-size:10pt}.pr-tbl td:last-child,.pr-tbl th:last-child{text-align:right}
.pr-dest{page-break-inside:avoid;break-inside:avoid;border:1px solid #cfd8e3;border-radius:10px;padding:10px 12px;margin:0 0 12px}
.pr-dest h2{margin:0 0 2px;font-size:15pt;color:#0a8a84}.pr-dest h3{margin:8px 0 3px;font-size:11pt}
.pr-dest img.ph{width:100%;max-height:60mm;object-fit:cover;border-radius:8px;margin:4px 0}
.pr-dest .sm{font-size:9.5pt;color:#4a566b}.pr-dest a{color:#0a6fa8;text-decoration:none}
.pr-total{font-size:13pt;font-weight:700;text-align:right;margin-top:4px}
}
</style>

  picks.forEach(x=>{

    if(f.hotels.length)m+=`**Hotels:**\n${f.hotels.map(h=>`- ${h.name}${h.stars?" "+"★".repeat(h.stars):""}${h.web?` – ${h.web}`:""}`).join("\n")}\n\n`;
    m+=`**Warum hier?** ${whyParts(x).why}\n\n**Darum lohnt es sich:** ${whyParts(x).good}\n\n**Sehenswert:**\n${f.sights.map(s=>`- ${s.title}${s.extract?`: ${s.extract}`:""}`).join("\n")}\n\n**Links:**\n${links(x).map(l=>`- [${l[0]}](${l[1]})`).join("\n")}\n\n`;
  });
  if(S.extras.length)m+=`## Zusatzkosten\n${S.extras.map(e=>`- ${e.name}: ${fmt(+e.amt||0)}`).join("\n")}\n\nSumme Zusatz: ${fmt(ex)}\n`;
  return m;

  const sum=picks.reduce((s,x)=>s+x.total,0);
  let h=`<div class="pr-head">${LOGO}<div><h1>Urlaubsplanung</h1><small>Erstellt am ${dt} mit Urlaubssuche</small></div></div>
  <div class="pr-meta"><b>${TYPES[type()]}</b>${a.from?` · ${a.from} bis ${a.to} (${n} Nächte)`:""} · ${a.adults} Erwachsene${a.kids?`, ${a.kids} Kinder`:""} · Start: ${esc(a.homeName)} · ${esc(SCOPES[a.scope]||"")} · Budget: ${a.budget?fmt(a.budget):"offen"}</div>`;
  if(!picks.length)return h+"<p>Noch keine Ziele gemerkt.</p>";
  h+=`<h3>Übersicht deiner Favoriten</h3><table class="pr-tbl"><tr><th>Ziel</th><th>Anreise</th><th>Fahrzeit</th><th>Summe ca.</th></tr>${picks.map(x=>`<tr><td><b>${esc(x.d.name)}</b></td><td>${ICON[x.tr.m]} ${x.tr.m}, ${Math.round(x.dist)} km</td><td>${hm(timeOf(x))}</td><td>${fmt(x.total)}</td></tr>`).join("")}</table>`;
  picks.forEach(x=>{
    const f=detFor(x);
    h+=`<div class="pr-dest"><h2>${esc(x.d.name)}${x.d.c?` (${x.d.c})`:""}</h2>${x.d.desc?`<div class="sm"><b>${esc(x.d.desc)}</b></div>`:""}
    <p class="sm"><b>Warum hier?</b> ${esc(whyParts(x).why)}<br><b>Darum lohnt es sich:</b> ${esc(whyParts(x).good)}</p>
    ${f.pic?`<img class="ph" src="${f.pic}" alt="">`:""}${x.d.extract?`<p class="sm">${esc(x.d.extract)}</p>`:""}
    <table class="pr-tbl"><tr><td>Anreise (${x.tr.m}, ${Math.round(x.dist)} km, ca. ${hm(timeOf(x))} einfach)</td><td>${fmt(x.tr.cost)}</td></tr><tr><td>Unterkunft, Essen, Aktivitäten (${n} Nächte)</td><td>${fmt(x.stay)}</td></tr><tr><td><b>Summe ca.</b></td><td><b>${fmt(x.total)}</b></td></tr></table>
    ${f.w?`<div class="sm">Wetter im gleichen Zeitraum ${f.w.year}: ${Math.round(f.w.min)}–${Math.round(f.w.max)} °C, ${Math.round(f.w.rain)} mm Regen</div>`:""}
    ${(f.det.events&&(f.det.events.holidays.length||f.det.events.tm.length))||(f.det.wv&&f.det.wv.event&&f.det.wv.event.length)?`<h3>Veranstaltungen</h3><div class="sm">${[...(f.det.events.holidays||[]).map(h=>`Feiertag ${fmtDE(h.date)}: ${esc(h.name)}`),...(f.det.events.tm||[]).map(e=>`${fmtDE(e.date)}: ${esc(e.name)}`),...((f.det.wv&&f.det.wv.event)||[]).slice(0,4).map(e=>esc(e.name))].join(" · ")}</div>`:""}
    ${f.hotels.length?`<h3>Hotels (Preise geschätzt, bitte prüfen)</h3><div class="sm">${f.hotels.map(hh=>`${esc(hh.name)}${hh.stars?" "+"★".repeat(hh.stars):""}`).join(" · ")}</div>`:""}
    <h3>Sehenswert</h3>${f.sights.map(s=>`<div class="sm"><b>${esc(s.title)}</b>${s.extract?` – ${esc(s.extract.length>200?s.extract.slice(0,200)+"…":s.extract)}`:""}</div>`).join("")}
    ${f.det.food&&f.det.food.length?`<h3>Essen</h3><div class="sm">${f.det.food.map(o=>esc(o.name)).join(" · ")}</div>`:""}
    <h3>Zum Prüfen &amp; Buchen</h3><div class="sm">${links(x).filter(l=>/Booking|Airbnb|Bahn|Flüge|Urlaubspiraten|Google Maps|Karte/.test(l[0])||true).slice(0,7).map(l=>`<a href="${l[1]}">${l[0]}</a>`).join(" · ")}</div></div>`;
  });
  if(S.extras.length)h+=`<h3>Zusatzkosten</h3><table class="pr-tbl">${S.extras.map(e=>`<tr><td>${esc(e.name)}</td><td>${fmt(+e.amt||0)}</td></tr>`).join("")}<tr><td><b>Summe Zusatz</b></td><td><b>${fmt(ex)}</b></td></tr></table>`;
  if(picks.length===1)h+=`<div class="pr-total">Gesamt ca. ${fmt(sum+ex)}${a.budget?` · Budget ${fmt(a.budget)}`:""}</div>`;
  h+=`<p class="sm" style="margin-top:14px">Preise sind Richtwerte und Schätzungen, keine Angebote. Buchung erfolgt extern über die genannten Anbieter.</p>`;
  return h;
}
async function exportPdf(btn){
  btn.textContent="Bereite PDF vor …";btn.disabled=true;
  await Promise.race([dq,new Promise(r=>setTimeout(r,20000))]);
  const box=$("#print");box.innerHTML=printHtml();
  await Promise.race([Promise.all([...box.querySelectorAll("img")].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r}))),new Promise(r=>setTimeout(r,6000))]);
  btn.textContent="PDF exportieren";btn.disabled=false;
  window.print();
}function download(name,text,type){const b=new Blob([text],{type:type+";charset=utf-8"}),u=URL.createObjectURL(b),l=document.createElement("a");l.href=u;l.download=name;l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

/* ---------- Kopfleiste ---------- */
function paintTheme(){const d=document.documentElement.dataset.theme==="dark";$("#bTheme").textContent=d?"☀️":"🌙"}
$("#bTheme").onclick=()=>{const n=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("urlaubssuche.theme",n)}catch(e){}paintTheme()};
paintTheme();
$("#bSave").onclick=()=>download("urlaubssuche-stand.json",JSON.stringify(S),"application/json");
$("#fLoad").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const s=JSON.parse(t);if(!s.a)throw 0;S=Object.assign(fresh(),s,{a:Object.assign(fresh().a,s.a)});render()}catch(x){alert("Datei nicht lesbar.")}})};
$("#bReset").onclick=()=>{if(confirm("Alle Eingaben löschen und neu starten?")){S=fresh();render()}};
/* ---------- Menü & Favoriten-Leiste ---------- */
const menu=$("#menu"),bMenu=$("#bMenu");
bMenu.onclick=e=>{e.stopPropagation();menu.hidden=!menu.hidden;bMenu.setAttribute("aria-expanded",String(!menu.hidden))};
document.addEventListener("click",e=>{if(!menu.hidden&&!e.target.closest(".menuwrap")){menu.hidden=true;bMenu.setAttribute("aria-expanded","false")}});
menu.addEventListener("click",e=>{if(e.target.closest("button"))menu.hidden=true});
$("#fLoad").addEventListener("change",()=>{menu.hidden=true});
let favOpen=false;
function paintFav(){
  const bar=$("#favbar"),cur=vis()[S.step]&&vis()[S.step].id,resView=cur==="res";
  const weit=scrollY>300;
  bar.hidden=!resView&&!weit;
  $("#favpill").hidden=!resView;
  $("#toTop").hidden=!weit;
  $("#favn").textContent=S.favs.length;
  const pn=$("#favpanel");
  pn.hidden=!favOpen||bar.hidden;
  if(pn.hidden)return;
  const r=evaluate();
  const items=S.favs.map(n=>r.find(x=>x.d.name===n)).filter(Boolean);
  pn.innerHTML=items.length?items.map(x=>`<div class="fi"><span><b>${esc(x.d.name)}</b><br><span class="small">${ICON[x.tr.m]} ${hm(timeOf(x))} · ca. ${fmt(x.total)}</span></span><a data-favdel="${esc(x.d.name)}" title="Entfernen">✕</a></div>`).join("")+`<div class="nav" style="margin-top:10px"><span></span><button class="btn pri" data-gosum="1" style="padding:6px 12px">Zur Zusammenfassung →</button></div>`:`<div class="small">Noch nichts gemerkt. Tippe bei einem Ziel auf „☆ Merken“.</div>`;
}
$("#favpill").onclick=()=>{favOpen=!favOpen;paintFav()};
$("#toTop").onclick=()=>{favOpen=false;paintFav();
  try{window.scrollTo({top:0,behavior:"smooth"})}catch(e){}
  setTimeout(()=>{const se=document.scrollingElement||document.documentElement;if(se.scrollTop>4){window.scrollTo(0,0);se.scrollTop=0;document.body.scrollTop=0}paintFav()},500);};
$("#favpanel").addEventListener("click",e=>{
  const d=e.target.closest("[data-favdel]");if(d){toggleFav(d.dataset.favdel);return}
  if(e.target.closest("[data-gosum]")){favOpen=false;S.step=vis().findIndex(s=>s.id==="sum");render()}
});addEventListener("scroll",()=>{const w=scrollY>300;const b=$("#toTop");if(b&&b.hidden===w)paintFav()},{passive:true});

$("#ft").textContent="Urlaubssuche · Version "+VERSION+" · Stand "+DEPLOYED;
render();
