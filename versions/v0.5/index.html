<style>
:root{--bg:#f2f5f8;--card:#fff;--ink:#1a2433;--mute:#62708a;--line:#e0e6ee;--acc:#0a8a84;--acc2:#e3f5f3;--warn:#c2410c;--ok:#15803d;--sun:#f59e0b;--hero1:#0a8a84;--hero2:#1d5fa8;--shadow:0 2px 10px rgba(20,40,70,.07)}

const MOODS={
 short:[["st","Stadt","Bummeln, Kultur, Essen"],["na","Landschaft / Natur","raus ins Grüne"],["wa","Wandern","Touren vor Ort"],["we","Wellness","Therme, Spa"],["ra","Radtour","Radwege entlang Fluss/See"]],

};
const REGIONS=[["me","Meer / Strand"],["be","Berge"],["in","Inseln"],["st","Städte"],["wm","Sicher warm (Sonne)"]];
const TYPES={we:"Wochenende",vw:"Verlängertes Wochenende",wo:"Urlaub (ca. 1 Woche)",lg:"Langurlaub (10+ Nächte)"};

const KEY="urlaubssuche.v1";
const fresh=()=>({step:0,a:{adults:2,kids:0,homeName:"Köln",lat:50.94,lon:6.96,from:"",to:"",type:"",budget:0,modes:["car","train"],maxH:0,moods:[],regions:[],lodging:"any",comfort:"mid",kidsOk:false},favs:[],extras:[]});
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.a)return Object.assign(fresh(),s,{a:Object.assign(fresh().a,s.a)})}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- Ableitungen ---------- */
const A=()=>S.a;
function nights(){const a=A();if(!a.from||!a.to)return 0;return Math.max(0,Math.round((new Date(a.to)-new Date(a.from))/864e5))}
function autoType(){const n=nights();if(!n)return "";return n<=2?"we":n<=4?"vw":n<=9?"wo":"lg"}
function type(){return A().type||autoType()||"vw"}
const isShort=()=>["we","vw"].includes(type());
function maxH(){const a=A();return a.maxH||({we:3,vw:5,wo:9,lg:14})[type()]}
function km(a,b,c,d){const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const eur=x=>Math.round(x/5)*5;
const fmt=x=>eur(x).toLocaleString("de-DE")+" €";

/* ---------- Live-Suche (Wikipedia, Open-Meteo, OpenStreetMap/Nominatim) ---------- */
const WIKI="https://de.wikipedia.org/w/api.php";
const Q={st:"Altstadt OR Großstadt OR Stadtzentrum",ku:"UNESCO-Welterbe OR Altstadt OR Sehenswürdigkeiten",na:"Nationalpark OR Naturpark OR Biosphärenreservat",wa:"Wandergebiet OR Mittelgebirge OR Wanderweg",we:"Thermalbad OR Kurort OR Heilbad",ra:"Radfernweg OR Flusstal OR Radweg",me:"Ostseebad OR Nordseebad OR Badeort OR Küstenort",be:"Alpen OR Skigebiet OR Gebirge",in:"Insel OR Urlaubsinsel",re:"Badeort OR Erholungsort OR Luftkurort",wm:"Mittelmeer OR Badeort OR Strand"};
const qcache=new Map();
const LIVE={key:"",list:[],busy:false,err:""};
const DET={};
function priceFor(lat,lon){if(lat>56)return 150;if(lat<44)return 100;if(lat>47.2&&lat<55.1&&lon>5.9&&lon<15.1)return 100;return 115}
async function wikiSearch(search,limit,extra){
  const p=new URLSearchParams(Object.assign({action:"query",format:"json",origin:"*",generator:"search",gsrsearch:search,gsrlimit:String(limit),gsrnamespace:"0",prop:"coordinates|pageimages|extracts|pageviews|description",coprimary:"primary",colimit:"50",piprop:"thumbnail",pithumbsize:"500",pilimit:"50",exintro:"1",explaintext:"1",exsentences:"2",exlimit:"20",pvipdays:"30"},extra||{}));
  const r=await fetch(WIKI+"?"+p);if(!r.ok)throw new Error("Wikipedia "+r.status);
  const j=await r.json();
  return Object.values((j.query&&j.query.pages)||{}).filter(x=>x.coordinates&&!/^(Liste|Bahnhof|Kategorie)|Begriffsklärung/.test(x.title)).map(x=>({
    title:x.title,lat:x.coordinates[0].lat,lon:x.coordinates[0].lon,
    pv:x.pageviews?Object.values(x.pageviews).reduce((a,b)=>a+(b||0),0):0,
    img:x.thumbnail&&!BADIMG.test(decodeURIComponent(x.thumbnail.source))?x.thumbnail.source:"",extract:x.extract||"",desc:x.description||""}));
}
// Filter: nur echte Urlaubsorte/Landschaften, keine Gebäude, Vereine, Bahnhöfe usw.
const PLACE=/Stadt|Gemeinde|Insel|Gebirge|Nationalpark|Naturpark|Ortsteil|Kurort|Seebad|Region|Landschaft|Tal\b|See\b|Küste|Gebiet|Ortschaft|Dorf|Berg\b|Skigebiet|Halbinsel|Mittelgebirge|Höhenzug|Weinbau|Biosphären|Heilbad|Badeort|Ferienort|Stadtteil|Archipel|Bucht|Strand|Fjord|Municipality|commune|comune|city|town|island|resort/i;
const BAD=/Halle\b|Bahnhof|Stadion|Schule|Gymnasium|Kaserne|Hochschule|Universität|Krankenhaus|Brücke|Flughafen|Zeche|Sender|Verein|Kirche|Schloss\b|Burg\b|Museum|Kloster|Bahnstrecke|Autobahn|Kraftwerk|Unternehmen|Politiker|Fußball|Radiosender|römisch|Kastell|Ortsgemeinde in der Verbandsgemeinde/i;
const BADIMG=/wappen|coat_of|flag|flagge|logo|siegel|karte|map|\.svg/i;
const SMALL=/Stadtbezirk|Stadtteil|Ortsteil|Ortschaft|Dorf|Gemeindeteil|Weiler/i;
function goodPlace(c){
  const d=c.desc||"";
  if(BAD.test(d)||/^(Liste|Bahnhof)/.test(c.title))return false;
  if(!d)return PLACE.test(c.extract.slice(0,200))&&c.pv>=300;
  if(!PLACE.test(d))return false;
  if(SMALL.test(d)&&c.pv<1500)return false;
  return c.pv>=150;
}
async function queryTag(tag,radius){
  const a=A(),k=[tag,radius,a.lat.toFixed(2),a.lon.toFixed(2)].join("|");
  if(qcache.has(k))return qcache.get(k);
  const res=await wikiSearch(`nearcoord:${radius}km,${a.lat},${a.lon} ${Q[tag]}`,50);
  const out=res.map(x=>({...x,tag})); qcache.set(k,out); return out;
}
function liveKey(){const a=A();return JSON.stringify([a.lat,a.lon,maxH(),a.moods,a.regions,a.modes,type()])}
async function discover(){
  const a=A(),key=liveKey();
  LIVE.busy=true;LIVE.err="";
  let tags=[...new Set([...a.moods,...a.regions])].filter(t=>Q[t]);
  if(!tags.length)tags=["st","na","me"];
  const flight=a.modes.includes("flight")&&!isShort();
  const radius=Math.min(1000,flight?1000:Math.max(50,Math.round(maxH()*68)));
  try{
    const all=(await Promise.allSettled(tags.map(t=>queryTag(t,radius)))).flatMap(r=>r.status==="fulfilled"?r.value:[]);
    // gleiche Orte zusammenführen, Cluster (<20 km) auf den beliebtesten Ort reduzieren
    all.sort((x,y)=>y.pv-x.pv);
    const kept=[];
    for(const c of all){
      if(!goodPlace(c))continue;
      const near=kept.find(k=>km(k.lat,k.lon,c.lat,c.lon)<20);
      if(near){if(!near.tags.includes(c.tag))near.tags.push(c.tag);continue}
      const tg=[c.tag], txt=c.title+" "+c.extract;
      if(/Insel/.test(txt)&&!tg.includes("in"))tg.push("in");
      if(/Nordsee|Ostsee|Strand|Küste|Mittelmeer|Atlantik/.test(txt)&&!tg.includes("me"))tg.push("me");
      if(/Alpen|Gebirge/.test(txt)&&!tg.includes("be"))tg.push("be");
      if(c.lat<44&&!tg.includes("wm"))tg.push("wm");
      kept.push({name:c.title,q:c.title.replace(/\s*\(.*\)/,""),c:"",lat:c.lat,lon:c.lon,tags:tg,pn:priceFor(c.lat,c.lon),sights:[],food:"",live:true,pv:c.pv,img:c.img,extract:c.extract,desc:c.desc,url:"https://de.wikipedia.org/wiki/"+encodeURIComponent(c.title.replace(/ /g,"_"))});
    }
    // kuratierte Ziele haben Vorrang bei Doppelungen
    LIVE.list=kept.filter(c=>!D.some(d=>km(d.lat,d.lon,c.lat,c.lon)<25));
    LIVE.key=key;
    if(!LIVE.list.length&&all.length===0)LIVE.err="Live-Suche lieferte keine Treffer (offline?). Es werden nur die kuratierten Ziele gezeigt.";
  }catch(e){LIVE.err="Live-Suche fehlgeschlagen: "+e.message;LIVE.key=key}
  LIVE.busy=false;
  if(vis()[S.step]&&vis()[S.step].id==="res")render();
}

/* ---------- Bewertung & Kosten ---------- */
function evaluate(){
  const a=A(),n=nights()||({we:2,vw:3,wo:7,lg:12})[type()];
  const adults=+a.adults||1,kids=+a.kids||0;
  const wanted=new Set();
  a.moods.forEach(m=>wanted.add(m));
  const res=[];
  for(const d of D.concat(LIVE.list)){
    const dist=km(a.lat,a.lon,d.lat,d.lon), road=dist*1.25;
    if(dist<40) continue; // Wohnort selbst ausschließen
    const modes=[];
    const carH=road/85, trainH=road/95;
    if(a.modes.includes("car")&&carH<=maxH()&&dist<=2600) modes.push({m:"Auto",h:carH,cost:road*2*0.15});
    if(a.modes.includes("train")&&trainH<=maxH()+1&&dist<1500) modes.push({m:"Bahn",h:trainH,cost:(adults+kids*0.5)*road*2*0.16});
    if(a.modes.includes("flight")&&!isShort()||a.modes.includes("flight")&&type()==="vw"&&dist>500){ if(dist>350) modes.push({m:"Flug",h:dist/700+3,cost:(adults+kids*0.75)*(60+dist*0.09)*1}); }
    if(!modes.length) continue;
    modes.sort((x,y)=>x.cost-y.cost);
    const tr=modes[0];
    let score=0;
    const hit=[];
    for(const t of wanted){ if(d.tags.includes(t)){score+=2;hit.push(t)} }
    if(a.moods.includes("re")&&a.moods.includes("ku")&&d.tags.includes("re")&&d.tags.includes("ku")) score+=2;
    for(const r of a.regions){ if(d.tags.includes(r)){score+=2;hit.push(r)} }
    if((a.moods.length||a.regions.length)&&score===0) continue;
    // sehr weite Ziele für kurze Reisen abwerten, sehr nahe Ziele für Langurlaub leicht abwerten
    if(d.live) score+=Math.log10(d.pv+10)*0.8; else score+=1.5;
    if(isShort()) score-=tr.h*0.3;
    if(n<=2&&tr.m==="Flug") continue;
    if(tr.m==="Flug"&&n<3) continue;
    const lf={hotel:1,apt:.85,camp:.6,any:.95}[a.lodging]||1, cf={low:.75,mid:1,high:1.4}[a.comfort]||1;
    const stay=d.pn*lf*cf*(adults+kids*0.5)*n;
    const total=stay+tr.cost;
    res.push({d,dist,tr,stay,total,score,n,hit});
  }
  res.sort((x,y)=>y.score-x.score||x.total-y.total);
  return res;
}

  <h3>Eigene Zusatzkosten (z. B. Mietwagen, Eintritte)</h3>
  ${S.extras.map((e,i)=>`<div class="row" style="margin-bottom:6px"><input value="${esc(e.name)}" data-en="${i}"><input type="number" value="${e.amt}" data-ea="${i}"></div>`).join("")}

  <div class="nav"><button class="btn" data-nav="-1">← Zurück</button><span><button class="btn" id="bMd">Markdown</button> <button class="btn pri" id="bPdf">PDF exportieren</button></span></div></div>`;
 }
};
const OPEN=new Set();
const ICON={Auto:"🚗",Bahn:"🚆",Flug:"✈️"};
const hm=h=>{const m=Math.round(h*60);return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+" h"};
const timeOf=x=>{const d=DET[x.d.name];return x.tr.m==="Auto"&&d&&d.drive?d.drive.h:x.tr.h};
function mapEmbed(x){
  const a=A(),d=x.d,dest=`${d.lat},${d.lon}`;
  return x.tr.m==="Flug"?`https://maps.google.com/maps?q=${dest}&z=6&output=embed`:`https://maps.google.com/maps?saddr=${encodeURIComponent(a.lat+","+a.lon)}&daddr=${dest}&dirflg=${x.tr.m==="Bahn"?"r":"d"}&output=embed`;
}
function cardHtml(x,i,n){
  const name=x.d.name,fav=S.favs.includes(name),b=A().budget,over=b&&x.total>b,open=OPEN.has(name);
  return `<div class="card dest" data-card="${esc(name)}">
   <div class="sumrow" data-toggle="${esc(name)}">
    <div class="mapph"><iframe src="${mapEmbed(x)}" loading="lazy" tabindex="-1" title="Route"></iframe></div>
    <div class="sumtxt"><h3>${i+1}. ${esc(name)} <span class="small">${x.d.c?`(${x.d.c})`:""}</span></h3>
     <div class="meta">${ICON[x.tr.m]} <b data-ft>${hm(timeOf(x))}</b> ${x.tr.m} einfach · ${Math.round(x.dist)} km</div>
     <div>${x.d.tags.map(t=>`<span class="tag">${TAGN[t]}</span>`).join("")}</div>
     <div class="sumprice">ca. <b class="${b?over?"over":"fine":""}">${fmt(x.total)}</b> gesamt <span class="small">· ${x.d.live?"live gefunden":"kuratiert"}</span></div>
     <span class="small" data-chev>${open?"▴ Details zuklappen":"▾ Details aufklappen"}</span></div>
    <button class="btn favb ${fav?"pri":""}" data-fav="${esc(name)}">${fav?"★ Gemerkt":"☆ Merken"}</button>
   </div>
   <div class="body" ${open?"":"hidden"}>${bodyHtml(x,i,n)}</div></div>`;
}
function bodyHtml(x,i,n){
  const a=A(),b=a.budget,over=b&&x.total>b,det=DET[x.d.name]||{};
  const wl=t=>`<a href="https://de.wikipedia.org/wiki/${encodeURIComponent(t.title.replace(/ /g,"_"))}" target="_blank" rel="noopener">${esc(t.title)}</a>`;
  const sights=x.d.sights.map(esc).join(" · ");
  const food=det.food&&det.food.length?det.food.map(f=>`<a href="${f.url}" target="_blank" rel="noopener">${esc(f.name)}</a>`).join(" · "):esc(x.d.food||"");
  const w=det.weather?`${Math.round(det.weather.min)}–${Math.round(det.weather.max)} °C, ${Math.round(det.weather.rain)} mm Regen (Vorjahr ${det.weather.year}, gleicher Zeitraum)`:"";
  const pic=det.photo||x.d.img;
  return `${pic?`<img src="${pic}" alt="" loading="lazy" style="width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-bottom:8px">`:""}
   ${x.d.desc?`<div class="small"><b>${esc(x.d.desc)}</b></div>`:""}
   ${x.d.extract?`<p class="small" style="margin:6px 0">${esc(x.d.extract)}</p>`:""}
   <table class="cost"><tr><td>Unterkunft, Essen, Aktivitäten (${n} N.)</td><td>${fmt(x.stay)}</td></tr><tr><td>Anreise (${x.tr.m}, hin & zurück)</td><td>${fmt(x.tr.cost)}</td></tr><tr class="t"><td>Summe ca.</td><td class="${b?over?"over":"fine":""}">${fmt(x.total)}</td></tr></table>
   ${mapHtml(x,det)}
   ${hotelsHtml(x,det,n)}
   ${det.sights&&det.sights.length?`<h3 style="font-size:15px">Sehenswürdigkeiten</h3>${det.sights.map(s=>`<div style="display:flex;gap:10px;margin:8px 0">${s.img?`<img src="${s.img}" alt="" loading="lazy" style="width:84px;height:64px;object-fit:cover;border-radius:8px;flex:none">`:""}<div class="small"><b>${wl(s)}</b> · <a href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}" target="_blank" rel="noopener">Karte</a><br>${esc(s.extract||"")}</div></div>`).join("")}`:""}
   <div class="small">${det.loading||det.queued&&!det.done?"⏳ Lade Live-Infos … ":""}${!det.sights&&sights?`<b>Sehenswert:</b> ${sights}<br>`:""}${det.tours&&det.tours.length?`<b>Touren/Wege:</b> ${det.tours.map(wl).join(" · ")}<br>`:""}${food?`<b>Essen:</b> ${food}<br>`:""}${w?`<b>Wetter:</b> ${w}`:""}
   ${det.done?"":`<button class="btn" data-det="${esc(x.d.name)}" style="padding:3px 10px;margin-top:4px">Live-Infos jetzt laden</button>`}</div>
   <div class="links">${links(x).map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗</a>`).join("")}</div>`;
}
function updateCard(name){
  const el=document.querySelector(`[data-card="${CSS.escape(name)}"]`);if(!el)return;
  const r=evaluate().slice(0,10),i=r.findIndex(x=>x.d.name===name);if(i<0)return;
  const n=nights()||({we:2,vw:3,wo:7,lg:12})[type()],x=r[i];
  el.querySelector(".body").innerHTML=bodyHtml(x,i,n);
  el.querySelector("[data-ft]").textContent=hm(timeOf(x));
  bindCard(el);
}
function bindCard(root){
  root.querySelectorAll("[data-map]").forEach(b=>b.onclick=()=>{const n=b.dataset.map;DET[n]=DET[n]||{};DET[n].map=!DET[n].map;updateCard(n)});
  root.querySelectorAll("[data-det]").forEach(b=>b.onclick=()=>{const d=evaluate().map(x=>x.d).find(d=>d.name===b.dataset.det);if(d){delete DET[d.name];b.textContent="Lade …";loadDetails(d)}});
}
function toggleFav(n){
  const i=S.favs.indexOf(n);i<0?S.favs.push(n):S.favs.splice(i,1);save();
  document.querySelectorAll(`[data-fav="${CSS.escape(n)}"]`).forEach(b=>{const f=S.favs.includes(n);b.classList.toggle("pri",f&&b.classList.contains("favb"));if(b.classList.contains("favb"))b.textContent=f?"★ Gemerkt":"☆ Merken"});
  document.querySelectorAll("[data-favcount]").forEach(e=>e.textContent=S.favs.length);
  if(vis()[S.step].id==="sum")render();
}
const TAGN={st:"Stadt",na:"Natur",we:"Wellness",wa:"Wandern",ra:"Rad",me:"Meer",be:"Berge",in:"Insel",ku:"Kultur",re:"Relaxen",wm:"warm"};

function bind(id){
  const v=$("#view");
  v.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{S.step+=+b.dataset.nav;render()});
  v.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    const k=o.dataset.k,val=o.dataset.v,a=A();
    if(o.dataset.multi==="1"){const i=a[k].indexOf(val);i<0?a[k].push(val):a[k].splice(i,1)}
    else a[k]=(k==="type"&&a.type===val)?"":val;
    save();render();
  });
  v.querySelectorAll("[data-fav]").forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFav(b.dataset.fav)});
  const bindVal=(sel,fn)=>{const e=$(sel);if(e)e.oninput=()=>{fn(e.value);save()}};
  bindVal("#adults",x=>A().adults=Math.max(1,+x||1));
  bindVal("#kids",x=>A().kids=Math.max(0,+x||0));
  bindVal("#budget",x=>A().budget=+x||0);
  const mh=$("#maxH");if(mh)mh.oninput=()=>{A().maxH=+mh.value;$("#hv").textContent=mh.value+" h";save()};
  const f=$("#from"),t=$("#to");
  if(f)f.onchange=()=>{A().from=f.value;if(!A().to||A().to<f.value)A().to=f.value;A().type="";render()};
  if(t)t.onchange=()=>{A().to=t.value;A().type="";render()};
  const h=$("#home");if(h)h.onchange=()=>{
    if(h.value==="_geo"){navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{Object.assign(A(),{homeName:"Mein Standort",lat:p.coords.latitude,lon:p.coords.longitude});save();render()},()=>{alert("Standort nicht verfügbar.");render()}):alert("Kein GPS verfügbar.")}
    else if(HOMES[h.value]){const c=HOMES[h.value];Object.assign(A(),{homeName:h.value,lat:c[0],lon:c[1]});save()}
  };
  const hg=$("#homeGo");if(hg)hg.onclick=async()=>{
    const q=$("#homeq").value.trim(),m=$("#homeMsg");if(!q)return;m.textContent="Suche …";
    try{const j=await (await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=de&name="+encodeURIComponent(q))).json();
      if(!j.results){m.textContent="Nichts gefunden.";return}
      const r=j.results[0];Object.assign(A(),{homeName:r.name,lat:r.latitude,lon:r.longitude});save();render();
    }catch(e){m.textContent="Suche fehlgeschlagen (offline?)."}
  };
  v.querySelectorAll("[data-refresh]").forEach(b=>b.onclick=()=>{qcache.clear();LIVE.key="";render()});
  bindCard(v);
  v.querySelectorAll("[data-toggle]").forEach(r=>r.onclick=e=>{if(e.target.closest("[data-fav]"))return;const n=r.dataset.toggle,c=r.closest(".card"),bd=c.querySelector(".body");OPEN.has(n)?OPEN.delete(n):OPEN.add(n);bd.hidden=!OPEN.has(n);c.querySelector("[data-chev]").textContent=OPEN.has(n)?"▴ Details zuklappen":"▾ Details aufklappen"});
  v.querySelectorAll("[data-all]").forEach(b=>b.onclick=()=>{const cards=[...v.querySelectorAll("[data-card]")];const open=cards.some(c=>!OPEN.has(c.dataset.card));cards.forEach(c=>{const n=c.dataset.card;open?OPEN.add(n):OPEN.delete(n);c.querySelector(".body").hidden=!open;c.querySelector("[data-chev]").textContent=open?"▴ Details zuklappen":"▾ Details aufklappen"})});
  v.querySelectorAll("[data-gosum]").forEach(b=>b.onclick=()=>{S.step=vis().findIndex(s=>s.id==="sum");render()});
  if(id==="sum"){
    v.querySelectorAll("[data-en]").forEach(e=>e.oninput=()=>{S.extras[+e.dataset.en].name=e.value;save()});
    v.querySelectorAll("[data-ea]").forEach(e=>e.onchange=()=>{S.extras[+e.dataset.ea].amt=+e.value||0;render()});
    $("#addEx").onclick=()=>{S.extras.push({name:"Posten",amt:0});render()};
    $("#bMd").onclick=()=>download("urlaub.md",markdown(),"text/markdown");
    $("#bPdf").onclick=e=>exportPdf(e.target);
  }
}
$("#steps").onclick=e=>{const b=e.target.closest("[data-go]");if(b){S.step=+b.dataset.go;render()}};

/* ---------- Export ---------- */
function summaryData(){
  const r=evaluate(),a=A(),n=nights()||({we:2,vw:3,wo:7,lg:12})[type()];
  return{r,a,n,picks:S.favs.map(f=>r.find(x=>x.d.name===f)).filter(Boolean),ex:S.extras.reduce((s,e)=>s+(+e.amt||0),0)};
}
function detFor(x){const det=DET[x.d.name]||{};return{det,pic:det.photo||x.d.img,sights:(det.sights&&det.sights.length)?det.sights:x.d.sights.map(t=>({title:t,extract:""})),hotels:det.hotels||[],w:det.weather}}
function markdown(){
  const {a,n,picks,ex}=summaryData();
  let m=`# Urlaubsplanung\n\n- Reiseart: ${TYPES[type()]}${a.from?` (${a.from} bis ${a.to}, ${n} Nächte)`:""}\n- Personen: ${a.adults} Erwachsene, ${a.kids} Kinder\n- Start: ${a.homeName}\n- Budget: ${a.budget?fmt(a.budget):"offen"}\n\n`;
  if(!picks.length)m+="_Noch keine Ziele gemerkt._\n";
  else m+=`| Ziel | Anreise | Fahrzeit | Summe |\n|---|---|---|---|\n${picks.map(x=>`| ${x.d.name} | ${x.tr.m}, ${Math.round(x.dist)} km | ${hm(timeOf(x))} | ${fmt(x.total)} |`).join("\n")}\n\n`;
  picks.forEach(x=>{
    const f=detFor(x);
    m+=`## ${x.d.name}${x.d.c?` (${x.d.c})`:""}\n${x.d.desc?`_${x.d.desc}_\n\n`:""}${x.d.extract?x.d.extract+"\n\n":""}- Anreise: ${x.tr.m}, ${Math.round(x.dist)} km, ca. ${hm(timeOf(x))}\n- Unterkunft/Essen/Aktivitäten: ${fmt(x.stay)}\n- Anreisekosten: ${fmt(x.tr.cost)}\n- **Summe ca. ${fmt(x.total)}**\n${f.w?`- Wetter (Vorjahr): ${Math.round(f.w.min)}–${Math.round(f.w.max)} °C, ${Math.round(f.w.rain)} mm Regen\n`:""}\n`;
    if(f.hotels.length)m+=`**Hotels:**\n${f.hotels.map(h=>`- ${h.name}${h.stars?" "+"★".repeat(h.stars):""}${h.web?` – ${h.web}`:""}`).join("\n")}\n\n`;
    m+=`**Sehenswert:**\n${f.sights.map(s=>`- ${s.title}${s.extract?`: ${s.extract}`:""}`).join("\n")}\n\n**Links:**\n${links(x).map(l=>`- [${l[0]}](${l[1]})`).join("\n")}\n\n`;
  });
  if(S.extras.length)m+=`## Zusatzkosten\n${S.extras.map(e=>`- ${e.name}: ${fmt(+e.amt||0)}`).join("\n")}\n\nSumme Zusatz: ${fmt(ex)}\n`;
  return m;
}
const LOGO=`<svg width="54" height="54" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#0a8a84"/><circle cx="40" cy="24" r="9" fill="#fbbf24"/><path d="M6 44 22 26l9 11 9-7 18 14z" fill="#fff"/><path d="M6 46q13-6 26 0t26 0v6q-13 6-26 0T6 52z" fill="#5eead4"/></svg>`;
function printHtml(){
  const {a,n,picks,ex}=summaryData();
  const dt=new Date().toLocaleDateString("de-DE");
  const sum=picks.reduce((s,x)=>s+x.total,0);
  let h=`<div class="pr-head">${LOGO}<div><h1>Urlaubsplanung</h1><small>Erstellt am ${dt} mit Urlaubssuche</small></div></div>
  <div class="pr-meta"><b>${TYPES[type()]}</b>${a.from?` · ${a.from} bis ${a.to} (${n} Nächte)`:""} · ${a.adults} Erwachsene${a.kids?`, ${a.kids} Kinder`:""} · Start: ${esc(a.homeName)} · Budget: ${a.budget?fmt(a.budget):"offen"}</div>`;
  if(!picks.length)return h+"<p>Noch keine Ziele gemerkt.</p>";
  h+=`<h3>Übersicht deiner Favoriten</h3><table class="pr-tbl"><tr><th>Ziel</th><th>Anreise</th><th>Fahrzeit</th><th>Summe ca.</th></tr>${picks.map(x=>`<tr><td><b>${esc(x.d.name)}</b></td><td>${ICON[x.tr.m]} ${x.tr.m}, ${Math.round(x.dist)} km</td><td>${hm(timeOf(x))}</td><td>${fmt(x.total)}</td></tr>`).join("")}</table>`;
  picks.forEach(x=>{
    const f=detFor(x);
    h+=`<div class="pr-dest"><h2>${esc(x.d.name)}${x.d.c?` (${x.d.c})`:""}</h2>${x.d.desc?`<div class="sm"><b>${esc(x.d.desc)}</b></div>`:""}
    ${f.pic?`<img class="ph" src="${f.pic}" alt="">`:""}${x.d.extract?`<p class="sm">${esc(x.d.extract)}</p>`:""}
    <table class="pr-tbl"><tr><td>Anreise (${x.tr.m}, ${Math.round(x.dist)} km, ca. ${hm(timeOf(x))} einfach)</td><td>${fmt(x.tr.cost)}</td></tr><tr><td>Unterkunft, Essen, Aktivitäten (${n} Nächte)</td><td>${fmt(x.stay)}</td></tr><tr><td><b>Summe ca.</b></td><td><b>${fmt(x.total)}</b></td></tr></table>
    ${f.w?`<div class="sm">Wetter im gleichen Zeitraum ${f.w.year}: ${Math.round(f.w.min)}–${Math.round(f.w.max)} °C, ${Math.round(f.w.rain)} mm Regen</div>`:""}
    ${f.hotels.length?`<h3>Hotels (Preise geschätzt, bitte prüfen)</h3><div class="sm">${f.hotels.map(hh=>`${esc(hh.name)}${hh.stars?" "+"★".repeat(hh.stars):""}`).join(" · ")}</div>`:""}
    <h3>Sehenswert</h3>${f.sights.map(s=>`<div class="sm"><b>${esc(s.title)}</b>${s.extract?` – ${esc(s.extract.length>200?s.extract.slice(0,200)+"…":s.extract)}`:""}</div>`).join("")}
    ${f.det.food&&f.det.food.length?`<h3>Essen</h3><div class="sm">${f.det.food.map(o=>esc(o.name)).join(" · ")}</div>`:""}
    <h3>Zum Prüfen &amp; Buchen</h3><div class="sm">${links(x).filter(l=>/Booking|Airbnb|Bahn|Flüge|Urlaubspiraten|Google Maps|Karte/.test(l[0])||true).slice(0,7).map(l=>`<a href="${l[1]}">${l[0]}</a>`).join(" · ")}</div></div>`;
  });
  if(S.extras.length)h+=`<h3>Zusatzkosten</h3><table class="pr-tbl">${S.extras.map(e=>`<tr><td>${esc(e.name)}</td><td>${fmt(+e.amt||0)}</td></tr>`).join("")}<tr><td><b>Summe Zusatz</b></td><td><b>${fmt(ex)}</b></td></tr></table>`;
  if(picks.length===1)h+=`<div class="pr-total">Gesamt ca. ${fmt(sum+ex)}${a.budget?` · Budget ${fmt(a.budget)}`:""}</div>`;
  h+=`<p class="sm" style="margin-top:14px">Preise sind Richtwerte und Schätzungen, keine Angebote. Buchung erfolgt extern über die genannten Anbieter.</p>`;
  return h;
}
async function exportPdf(btn){
  btn.textContent="Bereite PDF vor …";btn.disabled=true;
  await Promise.race([dq,new Promise(r=>setTimeout(r,20000))]);
  const box=$("#print");box.innerHTML=printHtml();
  await Promise.race([Promise.all([...box.querySelectorAll("img")].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r}))),new Promise(r=>setTimeout(r,6000))]);
  btn.textContent="PDF exportieren";btn.disabled=false;
  window.print();
}function download(name,text,type){const b=new Blob([text],{type:type+";charset=utf-8"}),u=URL.createObjectURL(b),l=document.createElement("a");l.href=u;l.download=name;l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
