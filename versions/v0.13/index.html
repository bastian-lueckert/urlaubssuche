<style>
:root{--bg:#f2f5f8;--card:#fff;--ink:#1a2433;--mute:#62708a;--line:#e0e6ee;--acc:#0a8a84;--acc2:#e3f5f3;--warn:#c2410c;--ok:#15803d;--sun:#f59e0b;--hero1:#0a8a84;--hero2:#1d5fa8;--shadow:0 2px 10px rgba(20,40,70,.07)}

*{box-sizing:border-box}
html{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .2s,color .2s}
header{padding:12px 14px;background:linear-gradient(120deg,var(--hero1),var(--hero2));color:#fff;display:flex;gap:8px;align-items:center;flex-wrap:nowrap;box-shadow:0 2px 14px rgba(0,0,0,.18)}

header h1{font-size:20px;margin:0;letter-spacing:.3px;line-height:1.1}
header .tag2{font-size:12px;opacity:.85;display:block;font-weight:400}

.dest{transition:box-shadow .2s,transform .2s}.dest:hover{box-shadow:0 6px 22px rgba(20,40,70,.14)}

a{color:var(--acc)}
main{max-width:920px;margin:0 auto;padding:16px}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.steps button{white-space:nowrap;font-size:13px;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mute);cursor:pointer}

.steps button.cur{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
h2{margin:0 0 4px;font-size:20px}h3{margin:14px 0 6px;font-size:16px}

label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:44px}

button.btn{min-height:42px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.row2{display:flex;gap:8px}.row2 input{flex:1}.row2 .btn{white-space:nowrap}
.btn.wide{width:100%}

.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sl{margin:16px 0 4px}
.sl.dim input[type=range]{opacity:.45}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.sl-top label{margin:0;font-size:15px;color:var(--ink)}
.sl-val{font-size:18px;font-weight:700;color:var(--acc);white-space:nowrap}
.sl-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:2px}
.slmore{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 14px}
.slmore input{max-width:120px}

input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:var(--line)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:var(--acc);border:3px solid var(--card);box-shadow:0 2px 8px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--acc);border:3px solid var(--card);box-shadow:0 2px 8px rgba(0,0,0,.3)}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--acc2)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--bg);user-select:none}
.opt.on{border-color:var(--acc);background:var(--acc2)}
.opt b{display:block}.opt span{font-size:13px;color:var(--mute)}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
button.btn{font:inherit;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.tag{display:inline-block;font-size:12px;background:var(--acc2);color:var(--acc);border-radius:99px;padding:2px 8px;margin:0 4px 4px 0}
.info{background:var(--acc2);border-radius:10px;padding:8px 12px;font-size:14px;margin-top:10px}
.dest h3{margin:0}.dest .meta{color:var(--mute);font-size:14px}
.cost{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}

.cost tr.t td{font-weight:700;border-bottom:0}
.over{color:var(--warn);font-weight:600}.fine{color:var(--ok);font-weight:600}

.ic16{width:16px;height:16px;border-radius:3px;object-fit:contain;flex:none;background:#fff}

.small{font-size:13px;color:var(--mute)}

.sumrow{display:flex;gap:14px;align-items:stretch;cursor:pointer;flex-wrap:wrap}

.mapph iframe{width:100%;height:100%;border:0;pointer-events:none}

.sumprice{margin:4px 0}
.favb{align-self:flex-start;white-space:nowrap}
.body{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}.body[hidden]{display:none}
.bigmap{height:380px;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin:6px 0;background:var(--bg);z-index:0}

.legend{margin-bottom:8px}

#print{display:none}

function markdown(){
  const {a,n,picks,ex}=summaryData();
  let m=`# Urlaubsplanung\n\n- Reiseart: ${TYPN(type())}${a.from?` (${a.from} bis ${a.to}, ${n} Nächte)`:""}\n- Personen: ${a.adults} Erwachsene, ${a.kids} Kinder\n- Start: ${a.homeName}\n- Reichweite: ${SCOPES[a.scope]||"-"}\n- Saison: ${SAISON.text||"-"}${SAISON.laender&&SAISON.laender.length?" (Schulferien: "+SAISON.laender.join(", ")+")":""}\n- Budget: ${a.budget?fmt(a.budget):"offen"}\n\n`;
  if(!picks.length)m+="_Noch keine Ziele gemerkt._\n";
  else m+=`| Ziel | Anreise | Fahrzeit | Summe |\n|---|---|---|---|\n${picks.map(x=>`| ${x.d.name} | ${x.tr.m}, ${Math.round(x.dist)} km | ${hm(timeOf(x))} | ${fmt(x.total)} |`).join("\n")}\n\n`;
  picks.forEach(x=>{
    const f=detFor(x);
    m+=`## ${x.d.name}${x.d.c?` (${x.d.c})`:""}\n${x.d.desc?`_${x.d.desc}_\n\n`:""}${x.d.extract?x.d.extract+"\n\n":""}- Anreise: ${x.tr.m}, ${Math.round(x.dist)} km, ca. ${hm(timeOf(x))}\n- Unterkunft/Essen/Aktivitäten: ${fmt(x.stay)}\n- Anreisekosten: ${fmt(x.tr.cost)}\n- **Summe ca. ${fmt(x.total)}**\n${f.w?`- Wetter (Vorjahr): ${Math.round(f.w.min)}–${Math.round(f.w.max)} °C, ${Math.round(f.w.rain)} mm Regen\n`:""}\n`;
    if(f.det.tours&&f.det.tours.length)m+=`**Touren & Wege:**\n${f.det.tours.map(t=>`- ${t.art==="rad"?"Rad":"Wandern"}: ${t.title}${t.dm!=null?` (${Math.round(t.dm)} km entfernt)`:""}`).join("\n")}\n\n`;
    if(f.hotels.length)m+=`**Hotels:**\n${f.hotels.map(h=>`- ${h.name}${h.stars?" "+"★".repeat(h.stars):""}${h.web?` – ${h.web}`:""}`).join("\n")}\n\n`;
    m+=`**Warum hier?** ${whyParts(x).why}\n\n**Darum lohnt es sich:** ${whyParts(x).good}\n\n**Sehenswert:**\n${f.sights.map(s=>`- ${s.title}${s.extract?`: ${s.extract}`:""}`).join("\n")}\n\n**Links:**\n${links(x).map(l=>`- [${l[0]}](${l[1]})`).join("\n")}\n\n`;
  });
  if(S.extras.length)m+=`## Zusatzkosten\n${S.extras.map(e=>`- ${e.name}: ${fmt(+e.amt||0)}`).join("\n")}\n\nSumme Zusatz: ${fmt(ex)}\n`;
  return m;
}

    <h3>Sehenswert</h3>${f.sights.map(s=>`<div class="sm"><b>${esc(s.title)}</b>${s.extract?` – ${esc(s.extract.length>200?s.extract.slice(0,200)+"…":s.extract)}`:""}</div>`).join("")}
    ${f.det.food&&f.det.food.length?`<h3>Essen</h3><div class="sm">${f.det.food.map(o=>esc(o.name)).join(" · ")}</div>`:""}
    <h3>Zum Prüfen &amp; Buchen</h3><div class="sm">${links(x).filter(l=>/Booking|Airbnb|Bahn|Flüge|Urlaubspiraten|Google Maps|Karte/.test(l[0])||true).slice(0,7).map(l=>`<a href="${l[1]}">${l[0]}</a>`).join(" · ")}</div></div>`;
  });

    const weg=()=>{try{if((location.hash||"").indexOf("#s=")===0)history.replaceState(null,"",location.pathname+location.search)}catch(e){}};
    weg();setTimeout(weg,300);setTimeout(weg,1500);   // manche Browser setzen die Adresse beim Laden erneut
    save();return true;
  }catch(e){return false}
}
function oeffneModal(html){const b=$("#modalbox");b.innerHTML=html;$("#modal").hidden=false;bindModal()}
function schliesseModal(){$("#modal").hidden=true}
$("#modal").onclick=e=>{if(e.target.id==="modal")schliesseModal()};
function bindModal(){
  const b=$("#modalbox");
  b.querySelectorAll("[data-vdel]").forEach(a=>a.onclick=()=>{S.visited.splice(+a.dataset.vdel,1);save();oeffneModal(visitedHtml())});
  b.querySelectorAll("[data-vjahr]").forEach(i=>i.onchange=()=>{S.visited[+i.dataset.vjahr].jahr=+i.value||null;save()});
  const hv=$("#hideVis");if(hv)hv.onchange=()=>{S.hideVisited=hv.checked;save()};
  const c=$("#visClose");if(c)c.onclick=()=>{schliesseModal();render()};
  const sc=$("#shareClose");if(sc)sc.onclick=schliesseModal;
  const si=$("#shareInput");if(si){si.onclick=()=>si.select();
    const cp=$("#shareCopy");if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(si.value);cp.textContent="✓ Kopiert"}catch(e){si.select();document.execCommand&&document.execCommand("copy");cp.textContent="✓ Kopiert"}};
  }
}

};
